plugins {
    id 'java'
    id("io.qameta.allure") version "3.1.0"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.30.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    implementation 'commons-io:commons-io:2.16.0'
    implementation 'io.qameta.allure:allure-junit5:2.25.0'
    implementation 'org.junit.jupiter:junit-jupiter-api:5.9.1'
    testImplementation 'org.aeonbits.owner:owner:1.0.12'
    implementation("io.qameta.allure:allure-junit5:2.29.1")
    implementation 'com.codeborne:selenide:7.8.1'
    implementation 'com.microsoft.playwright:playwright:1.43.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'

    //lombok
    compileOnly("org.projectlombok:lombok:1.18.44")
    annotationProcessor("org.projectlombok:lombok:1.18.44")
    testCompileOnly("org.projectlombok:lombok:1.18.44")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.44")
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
    //Пример как еще можно задать проперти:systemProperty "baseUrl", System.getProperty("baseUrl", "https://bonigarcia.dev/selenium-webdriver-java/")
}